# SpectraSense Model Configuration
model:
  name: "SpectraSense"
  input_dim: 192

  # Stage 1: Decoupled CNN Front-End
  cnn:
    shared:
      - in_channels: 1
        out_channels: 32
        kernel_size: 7
        padding: 3
      - in_channels: 32
        out_channels: 32
        kernel_size: 5
        padding: 2
    branches:
      branch_a:
        in_channels: 32
        out_channels: 16
        kernel_size: 3
        padding: 1
      branch_b:
        in_channels: 32
        out_channels: 16
        kernel_size: 7
        padding: 3
      branch_c:
        in_channels: 32
        out_channels: 16
        kernel_size: 11
        padding: 5
    fusion:
      in_channels: 48
      out_channels: 16
      kernel_size: 1

  # Stage 2: Patch Tokenization
  tokenizer:
    seq_length: 192
    patch_size: 8
    num_patches: 24
    d_model: 64
    use_cls_token: true

  # Stage 3: Transformer Encoder
  transformer:
    num_layers: 2
    num_heads: 4
    d_model: 64
    ffn_dim: 128
    dropout: 0.1
    activation: "gelu"
    pre_norm: true

  # Stage 4: Multi-Task Heads
  heads:
    pu_detection:
      in_features: 64
      num_classes: 2
    modulation:
      in_features: 64
      num_classes: 5
    snr:
      in_features: 64
      out_features: 1
